# Author: Enrico Veraldi
# PDR region grid charter

sector: pdr
cloudy_version: C25.00                                # Cloudy Version
ssp_library: parsec22.NT                              # SSP

sed_lambda_cut_A: 1.0e6                               # A, cut in red part

lhs:
  n_samples: 20000                                    # n_samples points -> x48 nodes SSP [20160000]
  seed: 42                                            # seed reproducibility
  optimization: random-cd                             # scipy.stats.qmc.LatinHypercube optimization

# axes of the PDR grid, order matters
axes:
  - {name: lognH_PDR,     min: 1.0,  max: 5.0, prior: uniform}
  - {name: logG0,         min: 0.0,  max:  5.0, prior: uniform}
  - {name: log_zeta_O,    min: -2.3, max:  0.5, prior: uniform}        # same as HII: anchored at runtime
  - {name: A_V_PDR,       min: 1.0,  max: 30.0, prior: log-uniform}
  - {name: log_chi_CR,    min: -1.0, max: 3.0, prior: uniform}
  - {name: xi_d,          min: 0.001,  max: 0.5, prior: uniform}
  - {name: z_CMB,         min: 0.0,  max:  12.0, prior: uniform}
  - {name: F_star,        min: 0.0,  max: 1.0, prior: uniform}
  - {name: beta,          min: -2.5, max: 0.0, prior: uniform}         # FUV tilt (nu/nu0)^beta in the Habing band

# the 48 nodes SSP (same HII)
nodes:
  n_tau_ssp: 8
  n_zstar: 6

#Chemistry (unified with HII)
chemistry:
  fiducial:  Nebular/Abundances/GC.abn
  scaling:   Nebular/Abundances/scaling_abd_Z.yaml
  zeta_map:  Nebular/Abundances/zeta_Z.npz
  depletion: jenkins2009
  axis: log_zeta_O

dust:
  xi_d_MW: 0.43                                       # gauge g(xi_d): (1/162)/Z_GC
  grains: ISM+PAH                                     # grains inizialization in CLOUDY input file (HERE ISM+PAH)

lines:
  master_list: Configs/Lines/pdr_full.yaml
  official_reference:                                 # Versioned with dataset and hash
    - Configs/Lines_Ref/LineList_HII.dat
    - Configs/Lines_Ref/LineList_PDR.dat
